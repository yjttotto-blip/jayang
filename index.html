<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>33평 아파트 3D 뷰어</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    color: #fff; user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  #hud {
    position: fixed; top: 12px; left: 12px;
    padding: 8px 12px; background: rgba(0,0,0,0.45);
    border-radius: 10px; font-size: 13px; line-height: 1.55;
    pointer-events: none; z-index: 10; max-width: 240px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #hud b { color: #ffcd6e; }

  #room-label {
    position: fixed; top: 12px; right: 12px;
    padding: 8px 16px; background: rgba(0,0,0,0.45);
    border-radius: 10px; font-size: 14px; font-weight: 600;
    z-index: 10; pointer-events: none;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }

  #start-overlay {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, rgba(20,30,45,0.55), rgba(0,0,0,0.85));
    display: flex; align-items: center; justify-content: center;
    z-index: 20; cursor: pointer;
  }
  #start-overlay .panel {
    background: rgba(20,22,30,0.92);
    padding: 30px 36px; border-radius: 16px;
    text-align: center; max-width: 340px;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  #start-overlay h1 { margin: 0 0 10px; font-size: 22px; letter-spacing: -0.3px; }
  #start-overlay p { margin: 4px 0; font-size: 13px; opacity: 0.8; }
  #start-overlay .btn {
    margin-top: 16px; padding: 11px 26px;
    background: #ffcd6e; color: #1c1612;
    border-radius: 999px; font-weight: 700;
    display: inline-block;
  }

  #joystick {
    position: fixed; left: 22px; bottom: 22px;
    width: 132px; height: 132px;
    border-radius: 50%;
    background: rgba(255,255,255,0.10);
    border: 2px solid rgba(255,255,255,0.25);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    z-index: 15; display: none; touch-action: none;
  }
  #joystick.visible { display: block; }
  #joystick .stick {
    position: absolute; left: 50%; top: 50%;
    width: 56px; height: 56px; margin: -28px 0 0 -28px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff, #c8d1da);
    box-shadow: 0 4px 16px rgba(0,0,0,0.45);
    pointer-events: none;
  }

  #sprint-btn {
    position: fixed; right: 22px; bottom: 22px;
    width: 80px; height: 80px; border-radius: 50%;
    background: rgba(255,205,110,0.18);
    border: 2px solid rgba(255,205,110,0.55);
    color: #ffcd6e; font-weight: 700; font-size: 12px;
    display: none; align-items: center; justify-content: center;
    z-index: 15; touch-action: none;
  }
  #sprint-btn.visible { display: flex; }
  #sprint-btn.active { background: rgba(255,205,110,0.45); }

  #look-pad {
    position: fixed; right: 0; top: 0; width: 50%; height: 100%;
    z-index: 12; display: none; touch-action: none;
  }
  #look-pad.visible { display: block; }
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <b>조작</b><br/>
  PC: 마우스 시점 / WASD 이동 / Shift 빠르게<br/>
  모바일: 좌측 조이스틱 (기울기 만큼) / 우측 드래그
</div>
<div id="room-label">현관</div>

<div id="start-overlay">
  <div class="panel">
    <h1>33평 아파트 3D 뷰어</h1>
    <p>거실 · 주방/식당 · 침실3 · 화장실2</p>
    <p style="margin-top:10px;font-size:12px;opacity:0.65;">PC는 화면 클릭 시 마우스 시점 잠금</p>
    <div class="btn">탭하여 시작</div>
  </div>
</div>

<div id="joystick"><div class="stick"></div></div>
<div id="sprint-btn">RUN</div>
<div id="look-pad"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ─── Constants ────────────────────────────────────────────────────────────────
const UNIT_W = 11.9, UNIT_D = 8.7;
const WALL_H = 2.7, WALL_T = 0.12;
const EYE_H  = 1.6;

const OX = -UNIT_W / 2, OZ = -UNIT_D / 2;
const px = (x) => OX + (UNIT_W - x); // floor plan is mirrored horizontally
const pz = (z) => OZ + z;

// ─── Renderer ────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

// ─── Scene + sky ─────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd9e6f3, 28, 80);

(function makeSky() {
  const c = document.createElement('canvas');
  c.width = 16; c.height = 512;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0.0, '#88b3df');
  grad.addColorStop(0.4, '#bfd6ee');
  grad.addColorStop(0.7, '#e6e3d6');
  grad.addColorStop(1.0, '#cebfa1');
  g.fillStyle = grad; g.fillRect(0, 0, 16, 512);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
})();

// Distant ground plane outside windows
{
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 200),
    new THREE.MeshStandardMaterial({ color: 0xa8b59a, roughness: 1.0 })
  );
  ground.rotation.x = -Math.PI/2;
  ground.position.y = -3;
  scene.add(ground);
}
// A few distant building blocks for parallax
function addBuilding(x, z, w, h, d, color) {
  const b = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color, roughness: 0.85 })
  );
  b.position.set(x, h/2 - 3, z);
  scene.add(b);
}
addBuilding(-25,  10,  8, 14, 6, 0xc8c5b8);
addBuilding(-30, -20, 10, 22, 8, 0xb6b3a4);
addBuilding(-22, -45,  9, 18, 7, 0xd1cdbe);
addBuilding( 24,  28,  8, 16, 6, 0xc4c0b1);
addBuilding( 30, -12, 12, 20, 9, 0xb8b5a6);
addBuilding( 28,  50,  8, 12, 6, 0xcfcbbc);

// ─── Camera rig ──────────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(72, window.innerWidth/window.innerHeight, 0.05, 200);
const yawObject = new THREE.Object3D();
const pitchObject = new THREE.Object3D();
yawObject.add(pitchObject);
pitchObject.add(camera);
yawObject.position.set(px(6.15), EYE_H, pz(2.5));
yawObject.rotation.y = Math.PI;
scene.add(yawObject);

// ─── Lighting ────────────────────────────────────────────────────────────────
scene.add(new THREE.HemisphereLight(0xfff7ec, 0xb0c0d0, 0.55));

const sun = new THREE.DirectionalLight(0xfff1d6, 1.2);
sun.position.set(10, 16, -8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { near:1, far:60, left:-18, right:18, top:18, bottom:-18 });
sun.shadow.bias = -0.0005;
scene.add(sun);

const sunFill = new THREE.DirectionalLight(0xc8d8ee, 0.25);
sunFill.position.set(-10, 10, 8);
scene.add(sunFill);

function addPendant(x, z, intensity=0.55, range=6) {
  const px_ = px(x), pz_ = pz(z);
  const light = new THREE.PointLight(0xffe5b8, intensity, range, 1.6);
  light.position.set(px_, WALL_H - 0.32, pz_);
  scene.add(light);
  // cord
  const cord = new THREE.Mesh(
    new THREE.CylinderGeometry(0.012, 0.012, 0.32, 6),
    new THREE.MeshStandardMaterial({ color: 0x222, roughness: 0.9 })
  );
  cord.position.set(px_, WALL_H - 0.16, pz_);
  scene.add(cord);
  // shade
  const shade = new THREE.Mesh(
    new THREE.ConeGeometry(0.18, 0.20, 24, 1, true),
    new THREE.MeshStandardMaterial({
      color: 0xfff3d6, side: THREE.DoubleSide,
      emissive: 0xffd089, emissiveIntensity: 0.7, roughness: 0.5
    })
  );
  shade.position.set(px_, WALL_H - 0.40, pz_);
  scene.add(shade);
}
addPendant(3.5, 2.0, 0.65, 7);   // living
addPendant(8.0, 4.2, 0.55, 7);   // kitchen/dining
addPendant(3.5, 6.5, 0.50, 6);   // master
addPendant(8.5, 1.4, 0.40, 5);   // top bedroom
addPendant(9.4, 7.1, 0.40, 5);   // bottom-right bedroom

// ─── Procedural textures ─────────────────────────────────────────────────────
function makeOakTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 1024;
  const g = c.getContext('2d');
  g.fillStyle = '#b88550'; g.fillRect(0, 0, 1024, 1024);
  const plankW = 96;
  for (let i = 0; i < 1024; i += plankW) {
    const tone = 60 + Math.random()*60;
    g.fillStyle = `rgb(${130+tone*0.4},${85+tone*0.35},${48+tone*0.3})`;
    g.fillRect(i, 0, plankW, 1024);
    for (let n = 0; n < 60; n++) {
      g.strokeStyle = `rgba(70,40,20,${0.04 + Math.random()*0.18})`;
      g.lineWidth = 0.4 + Math.random()*1.1;
      g.beginPath();
      const y0 = Math.random()*1024;
      g.moveTo(i + 1, y0);
      g.bezierCurveTo(
        i + plankW*0.3, y0 + (Math.random()-0.5)*40,
        i + plankW*0.7, y0 + (Math.random()-0.5)*40,
        i + plankW - 1, y0 + (Math.random()-0.5)*30
      );
      g.stroke();
    }
    if (Math.random() < 0.5) {
      const ky = Math.random()*1024;
      const kr = 4 + Math.random()*8;
      const grad = g.createRadialGradient(i+plankW/2, ky, 0, i+plankW/2, ky, kr*2);
      grad.addColorStop(0, 'rgba(60,30,10,0.7)');
      grad.addColorStop(1, 'rgba(60,30,10,0)');
      g.fillStyle = grad;
      g.beginPath(); g.arc(i+plankW/2, ky, kr*2, 0, Math.PI*2); g.fill();
    }
    g.strokeStyle = 'rgba(40,25,15,0.55)';
    g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 1024); g.stroke();
    const segs = 2 + Math.floor(Math.random()*2);
    for (let s = 1; s < segs; s++) {
      const y = (s/segs)*1024 + (Math.random()-0.5)*60;
      g.beginPath(); g.moveTo(i, y); g.lineTo(i+plankW, y); g.stroke();
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(8, 8);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
function makeTileTexture(color = '#dfe3e6', tile = '#ececec') {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = color; g.fillRect(0, 0, 256, 256);
  for (let y = 0; y < 256; y += 64) for (let x = 0; x < 256; x += 64) {
    const v = 220 + Math.random()*30;
    g.fillStyle = `rgb(${v},${v},${v-5})`;
    g.fillRect(x+2, y+2, 60, 60);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(4, 4);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function makeWallTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#fafafa'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 9000; i++) {
    g.fillStyle = `rgba(0,0,0,${Math.random()*0.025})`;
    g.fillRect(Math.random()*256, Math.random()*256, 1, 1);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(3, 2);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function makeRugTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#a07a52'; g.fillRect(0, 0, 256, 256);
  g.strokeStyle = 'rgba(70,45,28,0.5)'; g.lineWidth = 4;
  g.strokeRect(8, 8, 240, 240);
  g.strokeRect(20, 20, 216, 216);
  for (let y = 40; y < 220; y += 20) {
    g.strokeStyle = `rgba(${200+Math.random()*30},${170+Math.random()*30},${130+Math.random()*40},0.5)`;
    g.beginPath(); g.moveTo(40, y); g.lineTo(216, y); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const oakTex   = makeOakTexture();
const tileTex  = makeTileTexture();
const tileTex2 = makeTileTexture('#e4dfd6', '#f2ede3');
const wallTex  = makeWallTexture();
const rugTex   = makeRugTexture();

// ─── Materials ───────────────────────────────────────────────────────────────
const matOak     = new THREE.MeshStandardMaterial({ map: oakTex, roughness: 0.7 });
const matTile    = new THREE.MeshStandardMaterial({ map: tileTex, roughness: 0.4 });
const matTile2   = new THREE.MeshStandardMaterial({ map: tileTex2, roughness: 0.5 });
const matWall    = new THREE.MeshStandardMaterial({ map: wallTex, color: 0xffffff, roughness: 0.92 });
const matCeil    = new THREE.MeshStandardMaterial({ color: 0xfafafa, roughness: 0.95 });
const matBalcony = new THREE.MeshStandardMaterial({ color: 0xece5d0, roughness: 0.85 });
const matBaseboard = new THREE.MeshStandardMaterial({ color: 0xf5f1e9, roughness: 0.7 });

// ─── Floor + ceiling ─────────────────────────────────────────────────────────
{
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(UNIT_W, UNIT_D), matOak);
  floor.rotation.x = -Math.PI/2;
  floor.receiveShadow = true;
  scene.add(floor);

  const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(UNIT_W, UNIT_D), matCeil);
  ceiling.rotation.x = Math.PI/2;
  ceiling.position.y = WALL_H;
  scene.add(ceiling);
}

function addTileFloor(x, z, w, d, mat = matTile) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
  m.rotation.x = -Math.PI/2;
  m.position.set(px(x + w/2), 0.005, pz(z + d/2));
  m.receiveShadow = true;
  scene.add(m);
}
addTileFloor(5.4, 0.0, 1.5, 1.5, matTile2);   // bath1
addTileFloor(5.4, 5.4, 2.4, 3.3, matTile2);   // bath2
addTileFloor(5.4, 1.5, 1.5, 1.5, matTile);    // entrance
addTileFloor(0.0, 0.0, 1.5, UNIT_D, matBalcony);
addTileFloor(10.2, 0.0, 1.7, 2.7, matBalcony);
addTileFloor(11.1, 5.4, 0.8, 3.3, matBalcony);

// ─── Wall builder ────────────────────────────────────────────────────────────
const wallSegments = [];
function addWall(x1, z1, x2, z2, h = WALL_H, t = WALL_T, mat = matWall) {
  const dx = x2-x1, dz = z2-z1;
  const len = Math.hypot(dx, dz);
  if (len < 0.001) return;
  let w, d;
  if (Math.abs(dx) > Math.abs(dz)) { w = len; d = t; }
  else { w = t; d = len; }
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(px((x1+x2)/2), h/2, pz((z1+z2)/2));
  m.castShadow = m.receiveShadow = true;
  scene.add(m);
  wallSegments.push({
    minX: m.position.x - w/2, maxX: m.position.x + w/2,
    minZ: m.position.z - d/2, maxZ: m.position.z + d/2,
  });
  // baseboard
  const bb = new THREE.Mesh(new THREE.BoxGeometry(w*1.0, 0.10, d*1.4), matBaseboard);
  bb.position.set(px((x1+x2)/2), 0.05, pz((z1+z2)/2));
  scene.add(bb);
}
function _splitOpenings(ranges, openings) {
  let segs = [...ranges];
  openings.sort((a,b) => a.x-b.x).forEach(op => {
    const a = op.x - op.w/2, b = op.x + op.w/2;
    const out = [];
    segs.forEach(([s,e]) => {
      if (b <= s || a >= e) out.push([s,e]);
      else { if (a > s) out.push([s,a]); if (b < e) out.push([b,e]); }
    });
    segs = out;
  });
  return segs;
}
function addWallX(z, x1, x2, openings = [], h = WALL_H) {
  _splitOpenings([[x1,x2]], openings).forEach(([s,e]) => addWall(s, z, e, z, h));
}
function addWallZ(x, z1, z2, openings = [], h = WALL_H) {
  _splitOpenings([[z1,z2]], openings).forEach(([s,e]) => addWall(x, s, x, e, h));
}

// ─── Walls + doorways ────────────────────────────────────────────────────────
addWallX(0,      0, UNIT_W, [{ x: 6.15, w: 1.0 }]);
addWallX(UNIT_D, 0, UNIT_W, []);
addWallZ(0,      0, UNIT_D, []);
addWallZ(UNIT_W, 0, UNIT_D, []);

addWallZ(1.5, 0, UNIT_D, [{ x: 2.0, w: 1.6 }, { x: 6.5, w: 1.6 }]);
addWallZ(10.2, 0,   2.7,    [{ x: 1.5, w: 1.0 }]);
addWallZ(11.1, 5.4, UNIT_D, [{ x: 7.0, w: 1.0 }]);

addWallX(4.2, 1.5, 5.4, [{ x: 4.7, w: 0.9 }]);
addWallZ(5.4, 0, 3.0, [{ x: 2.4, w: 0.9 }]);
addWallZ(5.4, 4.2, UNIT_D, []);
addWallX(1.5, 5.4, 6.9, [{ x: 6.0, w: 0.7 }]);
addWallX(3.0, 5.4, 6.9, [{ x: 6.15, w: 1.0 }]);
addWallZ(6.9, 0, 3.0, []);
addWallX(2.7, 6.9, 10.2, [{ x: 8.5, w: 0.9 }]);
addWallX(2.7, 10.2, UNIT_W, []);
addWallX(5.4, 5.4, 7.8,  [{ x: 6.0, w: 0.7 }]);
addWallX(5.4, 7.8, 11.1, [{ x: 9.5, w: 0.9 }]);
addWallX(5.4, 11.1, UNIT_W, []);
addWallZ(7.8, 5.4, UNIT_D, []);

// ─── Door panels (visible, partially open swing doors) ───────────────────────
function addDoorPanel(hingeX, hingeZ, w = 0.85, axis = 'x', swing = -50, opening = 1.0) {
  // axis 'x' = panel rotates in XZ around hinge along Z (door fills along X)
  // axis 'z' = panel rotates around X-axis hinge (door fills along Z)
  const panel = new THREE.Mesh(
    new RoundedBoxGeometry(w, 2.05, 0.04, 2, 0.01),
    new THREE.MeshStandardMaterial({ color: 0xe9dec5, roughness: 0.6 })
  );
  // pivot group at hinge
  const pivot = new THREE.Group();
  pivot.position.set(px(hingeX), 1.025, pz(hingeZ));
  scene.add(pivot);
  // place panel offset so hinge sits at one edge
  if (axis === 'x') {
    panel.position.x = -w/2 * Math.sign(opening);
    pivot.rotation.y = swing * Math.PI/180;
  } else {
    panel.position.z = -w/2 * Math.sign(opening);
    pivot.rotation.y = (swing + 90) * Math.PI/180;
  }
  panel.castShadow = true;
  pivot.add(panel);
  // handle
  const handle = new THREE.Mesh(
    new THREE.SphereGeometry(0.025, 12, 8),
    new THREE.MeshStandardMaterial({ color: 0xc0a060, metalness: 0.85, roughness: 0.3 })
  );
  handle.position.set(panel.position.x + (w/2 - 0.07) * (opening > 0 ? -1 : 1), 0, 0.04);
  pivot.add(handle);
  // lintel above
  const lintel = new THREE.Mesh(
    new THREE.BoxGeometry(w + 0.08, 0.55, 0.13),
    matWall
  );
  if (axis === 'x') {
    lintel.position.set(px(hingeX + (opening>0 ? w/2 : -w/2)), 2.05 + 0.275, pz(hingeZ));
  } else {
    lintel.position.set(px(hingeX), 2.05 + 0.275, pz(hingeZ + (opening>0 ? w/2 : -w/2)));
    lintel.rotation.y = Math.PI/2;
  }
  scene.add(lintel);
}

// Open doors (visual only, do not add to wallSegments)
addDoorPanel(5.65, 0,    1.0, 'x', -55,  +1); // front door (swings into entrance)
addDoorPanel(6.35, 1.5,  0.7, 'x', -45,  -1); // bath1 door (into entrance)
addDoorPanel(5.4,  1.95, 0.9, 'z', -50,  +1); // entrance↔living
addDoorPanel(5.65, 3.0,  1.0, 'x', -50,  +1); // entrance↔kitchen

const matGlass = new THREE.MeshPhysicalMaterial({
  color: 0xc4dcec, transparent: true, opacity: 0.30,
  roughness: 0.04, metalness: 0.0,
  transmission: 0.7, thickness: 0.05,
});
const matFrame = new THREE.MeshStandardMaterial({ color: 0xf2ece1, roughness: 0.6 });

function addWindow(x1, z1, x2, z2, sillH = 0.85, top = 2.35) {
  const dx = x2-x1, dz = z2-z1;
  const len = Math.hypot(dx, dz);
  let w, d;
  if (Math.abs(dx) > Math.abs(dz)) { w = len; d = 0.05; }
  else { w = 0.05; d = len; }
  const cx = (x1+x2)/2, cz = (z1+z2)/2;
  // glass
  const glass = new THREE.Mesh(new THREE.BoxGeometry(w, top - sillH, d), matGlass);
  glass.position.set(px(cx), (top + sillH)/2, pz(cz));
  scene.add(glass);
  // frame top + bottom
  const ft = new THREE.Mesh(new THREE.BoxGeometry(w, 0.06, d*1.6), matFrame);
  ft.position.set(px(cx), top, pz(cz));
  scene.add(ft);
  const fb = new THREE.Mesh(new THREE.BoxGeometry(w, 0.06, d*1.6), matFrame);
  fb.position.set(px(cx), sillH, pz(cz));
  scene.add(fb);
  // mullion
  const mu = new THREE.Mesh(new THREE.BoxGeometry(0.04, top-sillH, d*1.2), matFrame);
  if (Math.abs(dx) > Math.abs(dz)) {
    mu.position.set(px(cx), (top+sillH)/2, pz(cz));
  } else {
    mu.position.set(px(cx), (top+sillH)/2, pz(cz));
    mu.rotation.y = Math.PI/2;
  }
  scene.add(mu);
}

// ─── Curtains ────────────────────────────────────────────────────────────────
function addCurtain(x1, z1, x2, z2, color = 0xf3e7d4) {
  const dx = x2-x1, dz = z2-z1;
  const len = Math.hypot(dx, dz);
  let w, d;
  if (Math.abs(dx) > Math.abs(dz)) { w = len; d = 0.04; }
  else { w = 0.04; d = len; }
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.85, side: THREE.DoubleSide });
  // two panels: left + right with gap
  const halfW = w/2 - 0.05;
  const halfD = d;
  const cx = (x1+x2)/2, cz = (z1+z2)/2;
  const offsetAxis = Math.abs(dx) > Math.abs(dz) ? 'x' : 'z';
  for (let s = -1; s <= 1; s += 2) {
    const panel = new THREE.Mesh(
      new THREE.BoxGeometry(
        offsetAxis === 'x' ? halfW*0.9 : 0.04,
        2.0,
        offsetAxis === 'z' ? halfW*0.9 : 0.04
      ),
      mat
    );
    if (offsetAxis === 'x') {
      panel.position.set(px(cx + s*halfW*0.45), 1.25, pz(cz));
    } else {
      panel.position.set(px(cx), 1.25, pz(cz + s*halfW*0.45));
    }
    scene.add(panel);
  }
}

// ─── Furniture builder helpers ───────────────────────────────────────────────
function addCollider(cx, cy, cz, w, h, d) {
  wallSegments.push({
    minX: cx - w/2, maxX: cx + w/2,
    minZ: cz - d/2, maxZ: cz + d/2,
  });
}

// rounded box mesh placed by floor-coord (x,z) corner
function rb(x, z, w, h, d, color, y0 = 0, opts = {}) {
  const r = Math.min(opts.radius ?? 0.025, w/2-0.005, h/2-0.005, d/2-0.005);
  const mat = new THREE.MeshStandardMaterial({
    color, roughness: opts.rough ?? 0.6, metalness: opts.metal ?? 0.0,
    map: opts.map, emissive: opts.emissive ?? 0x000000,
    emissiveIntensity: opts.emissiveIntensity ?? 0
  });
  const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, r), mat);
  m.position.set(px(x + w/2), y0 + h/2, pz(z + d/2));
  m.castShadow = m.receiveShadow = true;
  scene.add(m);
  if (opts.collide !== false) addCollider(m.position.x, m.position.y, m.position.z, w, h, d);
  return m;
}
function rbDecor(x, z, w, h, d, color, y0 = 0, opts = {}) {
  return rb(x, z, w, h, d, color, y0, { ...opts, collide: false });
}

function cyl(x, z, r, h, color, y0 = 0, opts = {}) {
  const mat = new THREE.MeshStandardMaterial({
    color, roughness: opts.rough ?? 0.6, metalness: opts.metal ?? 0.0,
  });
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 16), mat);
  m.position.set(px(x), y0 + h/2, pz(z));
  m.castShadow = m.receiveShadow = true;
  scene.add(m);
  return m;
}
function sph(x, z, r, color, y0 = 0, opts = {}) {
  const mat = new THREE.MeshStandardMaterial({
    color, roughness: opts.rough ?? 0.6, metalness: opts.metal ?? 0.0,
  });
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 18, 14), mat);
  m.position.set(px(x), y0 + r, pz(z));
  m.castShadow = m.receiveShadow = true;
  scene.add(m);
  return m;
}

// ─── PLAYER / CONTROLS ──────────────────────────────────────────────────────
const player = {
  baseSpeed: 2.6,
  sprintSpeed: 5.0,
  vx: 0, vz: 0,           // velocity
  yaw: yawObject.rotation.y,
  pitch: 0,
  radius: 0.28,
};

const keys = { w:false, a:false, s:false, d:false, shift:false };
window.addEventListener('keydown', (e) => {
  if (e.code === 'KeyW' || e.code === 'ArrowUp')    keys.w = true;
  if (e.code === 'KeyS' || e.code === 'ArrowDown')  keys.s = true;
  if (e.code === 'KeyA' || e.code === 'ArrowLeft')  keys.a = true;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.d = true;
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.shift = true;
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'KeyW' || e.code === 'ArrowUp')    keys.w = false;
  if (e.code === 'KeyS' || e.code === 'ArrowDown')  keys.s = false;
  if (e.code === 'KeyA' || e.code === 'ArrowLeft')  keys.a = false;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.d = false;
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.shift = false;
});

// pointer lock
let pointerLocked = false;
const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
renderer.domElement.addEventListener('click', () => {
  if (!isTouch) renderer.domElement.requestPointerLock?.();
});
document.addEventListener('pointerlockchange', () => {
  pointerLocked = document.pointerLockElement === renderer.domElement;
});
document.addEventListener('mousemove', (e) => {
  if (!pointerLocked) return;
  player.yaw   -= e.movementX * 0.0022;
  player.pitch -= e.movementY * 0.0022;
  player.pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, player.pitch));
});

// ─── Touch UI ──────────────────────────────────────────────────────────────
const joystick = document.getElementById('joystick');
const stick = joystick.querySelector('.stick');
const lookPad = document.getElementById('look-pad');
const sprintBtn = document.getElementById('sprint-btn');
if (isTouch) {
  joystick.classList.add('visible');
  lookPad.classList.add('visible');
  sprintBtn.classList.add('visible');
}

let joyId = null, joyCx = 0, joyCy = 0;
const joyMax = 52;
const joyVec = { x: 0, y: 0, mag: 0 };

joystick.addEventListener('touchstart', (e) => {
  const t = e.changedTouches[0];
  const r = joystick.getBoundingClientRect();
  joyCx = r.left + r.width/2; joyCy = r.top + r.height/2;
  joyId = t.identifier;
  e.preventDefault();
}, { passive: false });
joystick.addEventListener('touchmove', (e) => {
  if (joyId === null) return;
  for (const t of e.changedTouches) if (t.identifier === joyId) {
    let dx = t.clientX - joyCx, dy = t.clientY - joyCy;
    const len = Math.hypot(dx, dy);
    if (len > joyMax) { dx *= joyMax/len; dy *= joyMax/len; }
    stick.style.transform = `translate(${dx}px, ${dy}px)`;
    joyVec.x = dx / joyMax; joyVec.y = dy / joyMax;
    joyVec.mag = Math.min(len / joyMax, 1.0);
  }
  e.preventDefault();
}, { passive: false });
function joyEnd(e) {
  for (const t of e.changedTouches) if (t.identifier === joyId) {
    joyId = null; joyVec.x = 0; joyVec.y = 0; joyVec.mag = 0;
    stick.style.transform = 'translate(0,0)';
  }
}
joystick.addEventListener('touchend', joyEnd);
joystick.addEventListener('touchcancel', joyEnd);

let lookId = null, lookLastX = 0, lookLastY = 0;
lookPad.addEventListener('touchstart', (e) => {
  const t = e.changedTouches[0];
  lookId = t.identifier;
  lookLastX = t.clientX; lookLastY = t.clientY;
  e.preventDefault();
}, { passive: false });
lookPad.addEventListener('touchmove', (e) => {
  for (const t of e.changedTouches) if (t.identifier === lookId) {
    const dx = t.clientX - lookLastX, dy = t.clientY - lookLastY;
    lookLastX = t.clientX; lookLastY = t.clientY;
    player.yaw   -= dx * 0.0042;
    player.pitch -= dy * 0.0042;
    player.pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, player.pitch));
  }
  e.preventDefault();
}, { passive: false });
function lookEnd(e) {
  for (const t of e.changedTouches) if (t.identifier === lookId) lookId = null;
}
lookPad.addEventListener('touchend', lookEnd);
lookPad.addEventListener('touchcancel', lookEnd);

let sprintHeld = false;
sprintBtn.addEventListener('touchstart', (e) => {
  sprintHeld = true; sprintBtn.classList.add('active'); e.preventDefault();
}, { passive: false });
sprintBtn.addEventListener('touchend', (e) => {
  sprintHeld = false; sprintBtn.classList.remove('active'); e.preventDefault();
}, { passive: false });

// ─── Collision ─────────────────────────────────────────────────────────────
function tryMove(nx, nz) {
  const r = player.radius;
  for (const w of wallSegments) {
    const cx = Math.max(w.minX, Math.min(nx, w.maxX));
    const cz = Math.max(w.minZ, Math.min(nz, w.maxZ));
    const dx = nx - cx, dz = nz - cz;
    if (dx*dx + dz*dz < r*r) return false;
  }
  if (nx < -UNIT_W/2 + r || nx > UNIT_W/2 - r) return false;
  if (nz < -UNIT_D/2 + r || nz > UNIT_D/2 - r) return false;
  return true;
}

// ─── Room labeling ─────────────────────────────────────────────────────────
const ROOMS = [
  { name: '거실',         x1:1.5,  z1:0.0, x2:5.4,  z2:4.2 },
  { name: '주방·식당',    x1:5.4,  z1:3.0, x2:11.9, z2:5.4 },
  { name: '안방',         x1:1.5,  z1:4.2, x2:5.4,  z2:8.7 },
  { name: '침실 (서재)',  x1:6.9,  z1:0.0, x2:10.2, z2:2.7 },
  { name: '침실',         x1:7.8,  z1:5.4, x2:11.1, z2:8.7 },
  { name: '화장실 1',     x1:5.4,  z1:0.0, x2:6.9,  z2:1.5 },
  { name: '화장실 2',     x1:5.4,  z1:5.4, x2:7.8,  z2:8.7 },
  { name: '현관',         x1:5.4,  z1:1.5, x2:6.9,  z2:3.0 },
  { name: '발코니 (좌)',   x1:0.0,  z1:0.0, x2:1.5,  z2:8.7 },
  { name: '발코니 (우상)', x1:10.2, z1:0.0, x2:11.9, z2:2.7 },
  { name: '발코니 (우하)', x1:11.1, z1:5.4, x2:11.9, z2:8.7 },
];
const roomLabelEl = document.getElementById('room-label');
function updateRoomLabel() {
  const fx = UNIT_W - (yawObject.position.x - OX);
  const fz = yawObject.position.z - OZ;
  for (const r of ROOMS) {
    if (fx >= r.x1 && fx <= r.x2 && fz >= r.z1 && fz <= r.z2) {
      if (roomLabelEl.textContent !== r.name) roomLabelEl.textContent = r.name;
      return;
    }
  }
  roomLabelEl.textContent = '복도';
}

// ─── Main loop ─────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
let bobT = 0;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);

  // Input vector
  let mx = 0, mz = 0;
  if (keys.w) mz -= 1;
  if (keys.s) mz += 1;
  if (keys.a) mx -= 1;
  if (keys.d) mx += 1;
  let kbMag = Math.hypot(mx, mz);
  if (kbMag > 1) { mx /= kbMag; mz /= kbMag; kbMag = 1; }
  // joystick adds with magnitude
  if (joyVec.mag > 0) {
    mx += joyVec.x;
    mz += joyVec.y;
  }
  let mag = Math.hypot(mx, mz);
  if (mag > 1) { mx /= mag; mz /= mag; mag = 1; }
  // sprint
  const wantSprint = keys.shift || sprintHeld;
  const speed = wantSprint ? player.sprintSpeed : player.baseSpeed;

  // Convert to world delta (forward/right based on yaw)
  const fX = -Math.sin(player.yaw), fZ = -Math.cos(player.yaw);
  const sX =  Math.cos(player.yaw), sZ = -Math.sin(player.yaw);
  const wishX = (fX * (-mz) + sX * mx) * speed;
  const wishZ = (fZ * (-mz) + sZ * mx) * speed;

  // Smooth velocity (acceleration)
  const accel = 14.0;     // higher = snappier
  player.vx += (wishX - player.vx) * Math.min(accel * dt, 1);
  player.vz += (wishZ - player.vz) * Math.min(accel * dt, 1);

  const cur = yawObject.position;
  let nx = cur.x + player.vx * dt;
  let nz = cur.z + player.vz * dt;
  if (!tryMove(nx, cur.z)) { nx = cur.x; player.vx = 0; }
  if (!tryMove(nx, nz))    { nz = cur.z; player.vz = 0; }
  cur.x = nx; cur.z = nz;

  // Head bob (subtle)
  const movingMag = Math.hypot(player.vx, player.vz) / player.baseSpeed;
  bobT += dt * (wantSprint ? 9 : 6) * movingMag;
  const bob = Math.sin(bobT) * 0.025 * movingMag;
  pitchObject.position.y = bob;

  yawObject.rotation.y = player.yaw;
  pitchObject.rotation.x = player.pitch;

  updateRoomLabel();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

// ─── Resize + start overlay ────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
const overlay = document.getElementById('start-overlay');
function dismissOverlay() {
  overlay.style.display = 'none';
  if (!isTouch) renderer.domElement.requestPointerLock?.();
}
overlay.addEventListener('click', dismissOverlay);
overlay.addEventListener('touchend', (e) => { dismissOverlay(); e.preventDefault(); }, { passive: false });
</script>
